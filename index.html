<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clerkship HQ</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f6f6f4; --card:#ffffff; --ink:#18181b; --sub:#71717a; --line:#e7e7e4;
    --accent:#3b5bdb; --accentsoft:#eef1fd;
    --red:#c2410c; --redsoft:#fdf0ea; --amber:#a16207; --ambersoft:#fbf6e9;
    --green:#15803d; --greensoft:#eef6ef; --slate:#475569; --slatesoft:#f1f3f6;
    --radius:14px; --maxw:900px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:34px 20px 80px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---- gate ---- */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;max-width:340px;width:100%;text-align:center}
  #gate h1{font-size:19px;margin:0 0 4px}
  #gate p{color:var(--sub);font-size:13px;margin:0 0 18px}
  #gate input{width:100%;padding:11px 13px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;letter-spacing:.15em}
  #gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentsoft)}
  #gate button{margin-top:12px;width:100%;padding:11px;font-size:15px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px;cursor:pointer}
  #gate .err{color:var(--red);font-size:12.5px;height:16px;margin-top:8px}
  #app{display:none}

  /* ---- header ---- */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .top h1{font-size:24px;margin:0;letter-spacing:-.01em}
  .top .meta{color:var(--sub);font-size:12.5px;margin-top:4px}
  .top .meta b{color:var(--ink);font-weight:600}
  .lock{font-size:12px;color:var(--sub);cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:600;margin:30px 0 10px}

  /* ---- focus hero ---- */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .hero .label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
  .hero .focus{font-size:15.5px;margin-top:7px;line-height:1.55}
  .hero .now{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
  .hero .now b{color:var(--ink)}

  /* ---- cards ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px}
  .cd{display:flex;gap:14px;align-items:center}
  .cd .num{min-width:46px;text-align:center}
  .cd .num .n{font-size:24px;font-weight:700;line-height:1}
  .cd .num .u{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
  .cd .body{flex:1;min-width:0}
  .cd .body .t{font-weight:600}
  .cd .body .d{color:var(--sub);font-size:12.5px;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .c-red{background:var(--redsoft);color:var(--red)} .c-amber{background:var(--ambersoft);color:var(--amber)}
  .c-green{background:var(--greensoft);color:var(--green)} .c-accent{background:var(--accentsoft);color:var(--accent)}
  .c-slate{background:var(--slatesoft);color:var(--slate)}
  .empty{color:var(--sub);font-size:13.5px;padding:12px 2px}

  /* ---- rotations ---- */
  .progress{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bar{flex:1;height:8px;background:var(--slatesoft);border-radius:999px;overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--green);border-radius:999px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
  .rot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .rot .t{font-weight:600}
  .rot .code{color:var(--sub);font-weight:400;font-size:12.5px}
  .rot .n{color:var(--sub);font-size:12px;margin-top:6px;line-height:1.5}

  /* ---- table ---- */
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--sub)}
  details[open] summary::before{content:"▾ "}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .blk{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .rownow{background:var(--accentsoft)}
  .rowdone td{color:var(--sub)}
  .foot{color:var(--sub);font-size:12px;margin-top:26px;line-height:1.6}
  #err{color:var(--red);font-size:13px;white-space:pre-wrap;margin-top:14px}
  @media(max-width:520px){ .wrap{padding:22px 14px 60px} .top h1{font-size:21px} }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>🏥 Clerkship HQ</h1>
    <p>Enter password to continue</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <button id="go">Unlock</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<div id="app"><div class="wrap">
  <div class="top">
    <div>
      <h1>🏥 Clerkship HQ</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="lock" id="lock">Lock</div>
  </div>
  <div id="err"></div>
  <div id="content"></div>
  <div class="foot">
    Canon lives in the local Clerkship master files; this page reads a daily snapshot. Edit statuses &amp; checklists in
    <a href="https://app.notion.com/p/39ec258a964281e49927c6ef683d0a2c" target="_blank" rel="noopener">Notion HQ</a>.
    Countdowns recompute against today's date every time you open this.
  </div>
</div></div>

<script src="data.enc.js"></script>
<script>
(function(){
  "use strict";
  var KEY = "clerkship_hq_pw";
  var gate=document.getElementById("gate"), app=document.getElementById("app");
  function b64ToBytes(b64){ var bin=atob(b64), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
  async function decryptData(password){
    var E=window.CLERKSHIP_ENC;
    if(!E) throw new Error("encrypted payload not loaded");
    var km=await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64ToBytes(E.salt), iterations:E.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(E.iv)}, key, b64ToBytes(E.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function reveal(data){ window.CLERKSHIP_DATA=data; gate.style.display="none"; app.style.display="block"; try{render();}catch(e){document.getElementById("err").textContent="Render error: "+e.message;} }
  async function attempt(password, silent){
    try{
      var data=await decryptData(password);
      try{localStorage.setItem(KEY,password);}catch(e){}
      reveal(data);
    }catch(e){
      if(silent){ try{localStorage.removeItem(KEY);}catch(e2){} }
      else { document.getElementById("gerr").textContent="Incorrect password"; document.getElementById("pw").value=""; document.getElementById("pw").focus(); }
    }
  }
  function submit(){ var v=document.getElementById("pw").value.trim(); if(v) attempt(v,false); }
  document.getElementById("go").addEventListener("click",submit);
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") submit(); });
  document.getElementById("lock").addEventListener("click",function(){ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); });
  var stored=null; try{ stored=localStorage.getItem(KEY); }catch(e){}
  if(stored) attempt(stored,true);

  // ---------- helpers ----------
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function dparse(s){ return s ? new Date(s.slice(0,10)+"T00:00:00") : null; }
  function today0(){ var t=new Date(); t.setHours(0,0,0,0); return t; }
  function days(d){ return Math.round((d-today0())/864e5); }
  function fmt(d){ return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}); }
  function fmtShort(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
  function dayChip(n){
    if(n<0) return '<span class="chip c-slate">passed</span>';
    if(n===0) return '<span class="chip c-red">TODAY</span>';
    if(n===1) return '<span class="chip c-red">tomorrow</span>';
    var cls = n<=7 ? "c-red" : (n<=30 ? "c-amber" : "c-slate");
    return '<span class="chip '+cls+'">in '+n+' days</span>';
  }
  function typeChip(t){
    var m={Gate:"c-red",Deadline:"c-amber",Exam:"c-accent",Policy:"c-slate",Rotation:"c-green"};
    return '<span class="chip '+(m[t]||"c-slate")+'">'+esc(t||"")+'</span>';
  }
  function statChip(s){
    var m={"Done":"c-green","In progress":"c-accent","Scheduled":"c-amber","Upcoming":"c-slate","Not started":"c-slate"};
    return '<span class="chip '+(m[s]||"c-slate")+'">'+esc(s||"")+'</span>';
  }
  function cdCard(r){
    var d=dparse(r.d), n=days(d);
    var big = n<0 ? "✓" : (n===0 ? "0" : n);
    return '<div class="card"><div class="cd">'+
      '<div class="num"><div class="n">'+big+'</div><div class="u">'+(n<=0?"":"days")+'</div></div>'+
      '<div class="body"><div class="t">'+esc(r.item)+'</div>'+
      '<div class="d">'+fmt(d)+(r.det?" · "+esc(r.det):"")+'</div></div>'+
      '<div class="chips">'+typeChip(r.type)+dayChip(n)+'</div>'+
      '</div></div>';
  }

  // ---------- render ----------
  function render(){
    var D = window.CLERKSHIP_DATA;
    if(!D){ document.getElementById("err").textContent="data.js did not load."; return; }
    var cal=D.calendar||[], rots=D.rotations||[], blocks=D.blocks||[];

    // current block
    var t=today0(), curBlk=null, nextBlk=null;
    blocks.forEach(function(b){
      var s=dparse(b.s), e=dparse(b.e)||s;
      if(s&&t>=s&&t<=e) curBlk=b;
      if(s&&s>t&&!nextBlk) nextBlk=b;
    });

    // rotations progress
    var cores=rots.filter(function(r){return r.type==="Core";});
    var doneCores=cores.filter(function(r){return r.status==="Done";}).length;
    var pct=Math.round(doneCores/Math.max(cores.length,1)*100);

    // upcoming buckets
    var up = cal.filter(function(r){return r.status!=="Done" && r.d;})
                .map(function(r){return {r:r,n:days(dparse(r.d))};})
                .filter(function(x){return x.n>=0;})
                .sort(function(a,b){return a.n-b.n;});
    var week = up.filter(function(x){return x.n<=7;});
    var month = up.filter(function(x){return x.n>7 && x.n<=35;});

    // meta line
    var gen = D.generated ? new Date(D.generated.slice(0,10)+"T00:00:00") : null;
    document.getElementById("meta").innerHTML =
      (curBlk?'<b>'+esc(curBlk.name)+'</b>'+(curBlk.plan?' · '+esc(curBlk.plan):'')+' · ':'') +
      'cores '+doneCores+'/'+cores.length +
      (gen?' · data '+fmtShort(gen):'');

    var html="";

    // HERO
    html += '<div class="hero">';
    html += '<div class="label">Focus</div>';
    html += '<div class="focus">'+esc(D.focus||"—")+'</div>';
    html += '<div class="now">';
    if(curBlk){ var ce=dparse(curBlk.e); html+='<span>Current block · <b>'+esc(curBlk.name)+'</b> (ends '+fmtShort(ce)+')</span>'; }
    else if(nextBlk){ html+='<span>Next block · <b>'+esc(nextBlk.name)+'</b> ('+fmtShort(dparse(nextBlk.s))+')</span>'; }
    if(week[0]){ html+='<span>Next up · <b>'+esc(week[0].r.item)+'</b> '+dayChip(week[0].n)+'</span>'; }
    html += '</div></div>';

    // THIS WEEK
    html += '<h2>Due next 7 days</h2>';
    html += week.length ? week.map(function(x){return cdCard(x.r);}).join("")
                        : '<div class="empty">Nothing due in the next 7 days.</div>';

    // NEXT 30
    html += '<h2>Coming up (8–35 days)</h2>';
    html += month.length ? month.map(function(x){return cdCard(x.r);}).join("")
                         : '<div class="empty">Clear for the next month.</div>';

    // ROTATIONS
    html += '<h2>Rotations — '+doneCores+'/'+cores.length+' cores done</h2>';
    html += '<div class="progress"><div class="bar"><span style="width:'+pct+'%"></span></div><b>'+pct+'%</b></div>';
    html += '<div class="grid">'+rots.map(function(r){
      return '<div class="rot"><div class="t">'+esc(r.name)+' <span class="code">· '+esc(r.code||"")+'</span></div>'+
        '<div class="chips" style="margin-top:6px">'+statChip(r.status)+
        (r.comat&&r.comat!=="None"?'<span class="chip c-accent">COMAT '+esc(r.comat)+'</span>':'')+
        (r.hon?'<span class="chip c-green">Honors</span>':'')+'</div>'+
        (r.dates?'<div class="n"><b style="color:var(--ink);font-weight:600">'+esc(r.dates)+'</b></div>':'')+
        (r.notes?'<div class="n">'+esc(r.notes)+'</div>':'')+
      '</div>';
    }).join("")+'</div>';

    // BLOCK SCHEDULE
    html += '<h2>Block schedule'+(curBlk?' — now: '+esc(curBlk.name):'')+'</h2>';
    html += '<details><summary>Show all '+blocks.length+' blocks (Aug 2026 – May 2028)</summary>';
    html += '<div class="blk"><table><tr><th>Block</th><th>Dates</th><th>Kind</th><th>Notes</th></tr>';
    html += blocks.map(function(b){
      var s=dparse(b.s), e=dparse(b.e)||s, isNow=s&&t>=s&&t<=e;
      return '<tr class="'+(isNow?"rownow":"")+'"><td><b>'+esc(b.name)+'</b>'+(b.plan?'<div class="d" style="color:var(--sub);font-size:12px">'+esc(b.plan)+'</div>':'')+'</td>'+
        '<td style="white-space:nowrap">'+(s?fmtShort(s):"")+' – '+(e?fmtShort(e):"")+'</td>'+
        '<td>'+esc(b.kind||"")+'</td>'+
        '<td style="color:var(--sub);font-size:12px">'+esc(b.notes||"")+'</td></tr>';
    }).join("");
    html += '</table></div></details>';

    // FULL TIMELINE
    html += '<h2>Full timeline</h2>';
    html += '<details><summary>Show all '+cal.length+' dated items</summary>';
    html += '<div class="blk"><table><tr><th>Date</th><th>Item</th><th>Type</th><th>Status</th></tr>';
    html += cal.map(function(r){
      var d=dparse(r.d), n=d?days(d):null, done=r.status==="Done";
      return '<tr class="'+(done?"rowdone":"")+'"><td style="white-space:nowrap">'+(d?fmtShort(d):"")+
        (n!=null&&!done?'<div style="margin-top:3px">'+dayChip(n)+'</div>':'')+'</td>'+
        '<td><b>'+esc(r.item)+'</b>'+(r.det?'<div class="d" style="color:var(--sub);font-size:12px">'+esc(r.det)+'</div>':'')+'</td>'+
        '<td>'+typeChip(r.type)+'</td><td>'+statChip(r.status)+'</td></tr>';
    }).join("");
    html += '</table></div></details>';

    document.getElementById("content").innerHTML = html;
  }
})();
</script>
</body>
</html>
