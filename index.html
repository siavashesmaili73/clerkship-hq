<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clerkship HQ</title>
<style>
:root{--green:#18634a;--green-d:#0b3d2e;--line:#dde6e1;--bg:#f4f6f5;--mut:#5a6470;--red:#c0392b;}
*{box-sizing:border-box}
body{margin:0;font-family:Helvetica,Arial,sans-serif;color:#1f2733;background:linear-gradient(135deg,#eafaf1 0%,var(--bg) 52%,#eaf3ff 100%);}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px 24px;box-shadow:0 10px 30px rgba(11,61,46,.12)}
h1{margin:0 0 4px;color:var(--green-d);font-size:24px;letter-spacing:-.3px}
p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.45}
form{display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
button{border:none;border-radius:8px;background:var(--green);color:#fff;font-weight:700;padding:10px 14px;cursor:pointer}
button:hover{background:var(--green-d)}
.err{min-height:18px;margin-top:10px;color:var(--red);font-size:13px}
.fine{margin-top:14px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<main class="gate">
  <section class="gatebox">
    <h1>Clerkship HQ</h1>
    <p>Enter the class password to continue.</p>
    <form id="gateForm">
      <input id="gatePass" type="password" autocomplete="current-password" autofocus>
      <button type="submit">Unlock</button>
    </form>
    <div class="err" id="gateErr" role="alert"></div>
    <div class="fine">Unofficial student organizer. Always defer to current official course materials.</div>
  </section>
</main>

function fromB64(s){
  const bin=atob(s);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function deriveKey(password){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(password),{name:"PBKDF2"},false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:fromB64(payload.salt),iterations:payload.iterations,hash:"SHA-256"},
    base,
    {name:"AES-GCM",length:256},
    false,
    ["decrypt"]
  );
}
async function decrypt(password){
  const key=await deriveKey(password);
  const data=fromB64(payload.data);
  const tag=fromB64(payload.tag);
  const combined=new Uint8Array(data.length+tag.length);
  combined.set(data);
  combined.set(tag,data.length);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(payload.iv)},key,combined);
  return new TextDecoder().decode(plain);
}
document.getElementById("gateForm").addEventListener("submit",async (e)=>{
  e.preventDefault();
  const pass=document.getElementById("gatePass");
  const err=document.getElementById("gateErr");
  err.textContent="";
  try{
    const html=await decrypt(pass.value.trim());
    sessionStorage.setItem("clerkship_hq_unlocked","1");
    document.open();
    document.write(html);
    document.close();
  }catch(_){
    pass.value="";
    pass.focus();
    err.textContent="Incorrect password.";
  }
});
